  <title>MonClub Access — Popup Redesign (3 directions)</title>

  <!--
    ──────────────────────────────────────────────────────────────────────────
    POPUP REDESIGN PREVIEW — 3 polished directions from the multi-agent workflow
    ──────────────────────────────────────────────────────────────────────────
    Standalone, no build. Open directly in a browser. Use the "Design" switcher
    in the control panel (top-right) to flip between the 3 redesigns, and the
    other controls to exercise every state (lanes, granted/denied/birthday/
    staff/kids, photos, image flags, idle screen).

    Each direction is an isolated module exposing { LaneCard, IdleScreen, STYLE }
    with the SAME data contract as the production LaneCard. To ship one: copy its
    module (LaneCard + IdleScreen + its STYLE css) into
    tauri-ui/src/pages/PopupWindow.tsx (re-add TS types) and wire its keyframes.
    ──────────────────────────────────────────────────────────────────────────
  -->

  <script type="text/plain" id="app-src">
  const { useState, useEffect, useRef, useMemo } = React;

  /* ── globals exposed to every design module (the data contract) ── */
  const MIN_DURATION_MS = 2500;

  const CONFETTI_COLORS = ["#facc15", "#f472b6", "#a78bfa", "#34d399", "#fb923c", "#60a5fa"];

  function isTodayBirthday(birthday) {
    if (!birthday) return false;
    try {
      const t = new Date();
      const mm = String(t.getMonth() + 1).padStart(2, "0");
      const dd = String(t.getDate()).padStart(2, "0");
      const parts = birthday.slice(0, 10).split("-");
      if (parts.length < 3) return false;
      return (parts[1] + "-" + parts[2]) === (mm + "-" + dd);
    } catch (e) { return false; }
  }

  /* ══════════════ DESIGN DIRECTIONS (generated by the workflow) ══════════════ */
  const DIRECTIONS = [];
DIRECTIONS.push((function(){
function LaneCard({ lane, layout, onImageError }) {

  const granted = !!event.allowed;

    no:   { ring: "#dc2626", soft: "#fca5a5", deep: "#991b1b", label: "Accès refusé",   greet: "Bonjour" },
    bday: { ring: "#f59e0b", soft: "#fcd34d", deep: "#b45309", label: "Joyeux anniversaire !", greet: "Bienvenue" }

      var col = CONFETTI_COLORS[i % CONFETTI_COLORS.length];

        className: "welcome-confetti",

          background: col,

          animationDuration: (2.4 + (i % 4) * 0.5) + "s",
          borderRadius: i % 3 === 0 ? "50%" : "2px"
        }
      }));
    }
    confetti = React.createElement("div", { className: "welcome-confetti-wrap" }, pieces);
  }

  // ── Photo ─────────────────────────────────────────────
  var photoInner;
  if (event.popupShowImage !== false && lane.imgUrl) {
    photoInner = React.createElement("img", {
      src: lane.imgUrl,

      onError: function () { onImageError(lane.laneId); }

  } else {
    photoInner = React.createElement("div", { className: "welcome-photo-fallback" }, initial);
  }
  var photo = React.createElement("div", {
    className: "welcome-photo",
    style: { "--ring": P.ring, "--soft": P.soft }
  }, photoInner,
    React.createElement("div", { className: "welcome-photo-badge", style: { background: P.ring } },
      React.createElement("div", { className: "welcome-badge-ic" }, React.createElement(StatusIcon, null))));

  // ── Badges (staff / kids) ─────────────────────────────
  var typeBadge = null;
  if (event.userMembersType === "STAFF") {
    typeBadge = React.createElement("span", { className: "welcome-tag welcome-tag-staff" },
      React.createElement(StaffGlyph, null), React.createElement("span", null, "Staff"));
  } else if (event.userMembersType === "KIDS") {
    typeBadge = React.createElement("span", { className: "welcome-tag welcome-tag-kids" },
      React.createElement(KidsGlyph, null), React.createElement("span", null, "Kids Club"));
  }

  var hasMemId = event.userMembershipId != null && Number(event.userMembershipId) !== 0;
  var memText = event.userMembershipTitle || (hasMemId ? "# " + event.userMembershipId : "");
  var memChip = memText ? React.createElement("span", { className: "welcome-tag welcome-tag-mem" }, memText) : null;

  // ── Validity / reason block ───────────────────────────
  var vf = (event.userValidFrom || "").slice(0, 10);
  var vt = (event.userValidTo || "").slice(0, 10);
  var showValidity = !isSplit2 && !isSplit3; // condensed: hero only
  var detailBlock = null;
  if (!granted && event.reason) {
    detailBlock = React.createElement("div", { className: "welcome-reason" },
      React.createElement("div", { className: "welcome-reason-label" }, "Motif"),
      React.createElement("div", { className: "welcome-reason-text" }, event.reason));
  } else if (showValidity && (vf || vt)) {
    detailBlock = React.createElement("div", { className: "welcome-validity" },
      React.createElement("span", { className: "welcome-valid-cap" }, "Validité"),
      React.createElement("span", { className: "welcome-valid-val" }, vf || "—"),
      React.createElement("span", { className: "welcome-valid-arrow" }, "→"),
      React.createElement("span", { className: "welcome-valid-val" }, vt || "—"));
  }

  // ── Image flags (hero only) ───────────────────────────
  var flags = [];
  if (isHero) {
    if (event.imageSource === "PROFILE_BORROWED") flags.push("Photo de profil — aucune image club");
    if (event.userImageStatus === "REQUIRED_CHANGE") flags.push("Changement d'image requis");
  }
  var flagBlock = flags.length ? React.createElement("div", { className: "welcome-flags" },
    flags.map(function (f, idx) {
      return React.createElement("span", { key: idx, className: "welcome-flag" },
        React.createElement(FlagGlyph, null), React.createElement("span", null, f));
    })) : null;

  // ── Status pill (solid, high contrast) ────────────────
  var statusPill = React.createElement("div", {
    className: "welcome-status",
    style: { background: P.ring }
  },
    React.createElement("span", { className: "welcome-status-ic" }, React.createElement(StatusIcon, null)),
    React.createElement("span", { className: "welcome-status-txt" }, P.label));

  // ── Greeting eyebrow + dominant full name ─────────────
  var eyebrow;
  if (birthday) eyebrow = "Joyeux anniversaire !";
  else eyebrow = (granted ? P.greet : P.greet) + (firstName ? ", " + firstName : "");

  var nameNode = React.createElement("div", {
    className: "welcome-name" + (birthday ? " welcome-name-bday" : "")

  // ── Footer (device + scan mode) ───────────────────────

  var scanTxt = scanLabels[event.scanMode] || event.scanMode || "";

    React.createElement("span", { className: "welcome-foot-dev" },

      React.createElement("span", { className: "welcome-foot-dev-txt" }, event.deviceName || "Entrée")),
    scanTxt ? React.createElement("span", { className: "welcome-foot-scan", style: { background: P.ring } }, scanTxt) : null);

  // ── Info column ───────────────────────────────────────
  var tags = [typeBadge, memChip].filter(Boolean);
  var showTags = tags.length && !isSplit3;
  var info = React.createElement("div", { className: "welcome-info" },
    statusPill,
    greeting,
    showTags ? React.createElement("div", { className: "welcome-tags" }, tags) : null,
    detailBlock,
    flagBlock,

  var progress = React.createElement("div", { className: "welcome-progress" },
    React.createElement("div", { className: "welcome-progress-bar", style: { width: (ratio * 100) + "%", background: P.ring } }));

  return React.createElement("div", {
    className: "welcome-card welcome-state-" + state + (isHero ? " welcome-hero" : " welcome-split") + (isSplit2 ? " welcome-split2" : "") + (isSplit3 ? " welcome-split3" : ""),
    style: {
      opacity: lane.fadingOut ? 0 : 1,
      transition: "opacity " + FADE_OUT_MS + "ms ease",

    }
  },
    confetti,
    React.createElement("div", { className: "welcome-body" }, photo, info),
    progress);
}

function IdleScreen({ gymName }) {
  const name = gymName || "MonClub Access";
  var blobs = [];
  for (var i = 0; i < 3; i++) {
    blobs.push(React.createElement("div", { key: i, className: "welcome-idle-blob welcome-idle-blob-" + i }));
  }
  return React.createElement("div", { className: "welcome-idle" },
    blobs,
    React.createElement("div", { className: "welcome-idle-inner" },
      React.createElement("div", { className: "welcome-idle-wave" }, "👋"),
      React.createElement("div", { className: "welcome-idle-hi" }, "Bienvenue"),
      React.createElement("div", { className: "welcome-idle-name" }, name),
      React.createElement("div", { className: "welcome-idle-sub" }, "Présentez votre badge, QR code ou empreinte"),
      React.createElement("div", { className: "welcome-idle-dots" },
        React.createElement("span", { className: "welcome-idle-dot" }),
        React.createElement("span", { className: "welcome-idle-dot" }),
        React.createElement("span", { className: "welcome-idle-dot" }))));
}

const STYLE = `
.welcome-card, .welcome-idle, .welcome-card * { font-family: "Outfit", "Manrope", system-ui, sans-serif; box-sizing: border-box; }

.welcome-card {
  position: relative;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  overflow: hidden;
  border-radius: 40px;
  padding: clamp(20px, 3vw, 48px);
  color: #3b2f2a;
  background:
    radial-gradient(120% 120% at 0% 0%, rgba(255,255,255,.9), rgba(255,255,255,0) 55%),
    linear-gradient(150deg, #fff7ed 0%, #fef3e6 38%, #fde9d9 100%);
  box-shadow: 0 30px 80px -28px rgba(120,72,40,.42), inset 0 0 0 1.5px rgba(255,255,255,.7);
  animation: welcome-pop 520ms cubic-bezier(.18,.9,.28,1.2) both;
}
.welcome-card::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background: transparent;
}
.welcome-state-ok {
  background: linear-gradient(150deg, #f3fcf4 0%, #e7f8ec 42%, #d7f2e0 100%);
  box-shadow: 0 30px 80px -26px rgba(22,163,74,.42), inset 0 0 0 1.5px rgba(255,255,255,.7);
}
.welcome-state-ok::before { background: radial-gradient(85% 75% at 100% -10%, rgba(134,239,172,.5), transparent 60%); }
.welcome-state-no {
  background: linear-gradient(150deg, #fff4f1 0%, #ffe2dc 42%, #ffcfc6 100%);
  box-shadow: 0 30px 80px -26px rgba(220,38,38,.4), inset 0 0 0 1.5px rgba(255,255,255,.65);
}
.welcome-state-no::before { background: radial-gradient(90% 80% at 100% -10%, rgba(252,165,165,.55), transparent 60%); }
.welcome-state-bday { background: linear-gradient(150deg, #fffaf0 0%, #fff1d6 45%, #ffe6c2 100%); }
.welcome-state-bday::before { background: radial-gradient(85% 80% at 100% -10%, rgba(252,211,77,.5), transparent 60%); }

@keyframes welcome-pop {
  0%   { opacity: 0; transform: translateY(22px) scale(.965); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.welcome-body { position: relative; flex: 1; min-height: 0; display: flex; gap: clamp(18px, 2.4vw, 40px); align-items: center; }
.welcome-hero .welcome-body { flex-direction: row; }
.welcome-split .welcome-body { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: clamp(12px, 1.6vw, 20px); min-height: 0; overflow: hidden; }

/* ── Photo ── */
.welcome-photo {
  position: relative; flex-shrink: 0; border-radius: 36px;
  background: #fff;
  box-shadow: 0 18px 44px -16px rgba(120,72,40,.45);

.welcome-hero .welcome-photo { width: clamp(180px, 30%, 360px); aspect-ratio: 1; }
.welcome-split2 .welcome-photo { width: 100%; aspect-ratio: 16/11; align-self: center; flex-shrink: 0; }

.welcome-photo::after {

.welcome-status {

  padding: clamp(9px,1.1vw,14px) clamp(16px,1.8vw,24px); border-radius: 999px;
